{# A village picked from a list, not typed. Every district's villages are on
   the page in optgroups, so it works without script; stepper.js narrows the
   list to the district chosen in #district.
   Expects: vid, vname, vvalue, vrequired #}
{% set places = namespace(found=false) %}
<select id="{{ vid }}" name="{{ vname }}" data-village{{ ' required' if vrequired }}
        data-pick="{{ t('-- Select village --') }}" data-first="{{ t('Select the district first') }}">
  <option value="">{{ t("-- Select village --") }}</option>
  {% for district, items in village_options().items() %}
  <optgroup label="{{ t(district) }}" data-district="{{ district }}">
    {% for value, label in items %}<option value="{{ value }}"{% if value == vvalue %}{% set places.found = true %} selected{% endif %}>{{ label }}</option>{% endfor %}
  </optgroup>
  {% endfor %}
  {% if vvalue and not places.found %}<option value="{{ vvalue }}" selected>{{ vvalue }}</option>{% endif %}
</select>
