{% extends "base.html" %}
{% block title %}Centre Member Sign In{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth-art staff">
    <img src="{{ url_for('static', filename='img/mandi-yard.jpg') }}" width="1200" height="700" alt="">
    <h2>Procurement centre counter</h2>
  </div>

  <div class="auth-form">
    <p class="eyebrow">Members only</p>
    <h1>Centre member sign in</h1>
    <form method="post">
      <div class="field">
        <label for="staff_code">Member code <span class="req">*</span></label>
        <input type="text" id="staff_code" name="staff_code" value="{{ code }}"
               style="text-transform:uppercase" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn block large" type="submit">{{ icon('log-in') }}Sign in</button>
    </form>
    <p class="small mt">District supervisor? <a href="{{ url_for('super_login') }}">Supervisor sign in</a></p>
    <div class="notice warning small">Demo: Rudrapur counter <strong>RUD01</strong>, password <strong>demo123</strong></div>
  </div>
</div>
{% endblock %}
