# Render blueprint (New -> Blueprint). The IVR is its own service, not in here.
# procurement.db isn't in git, it has to be put on a persistent disk by hand.
services:
  - type: web
    name: krishi-sutra
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      # OWM_API_KEY / GEMINI_API_KEY go in the dashboard

