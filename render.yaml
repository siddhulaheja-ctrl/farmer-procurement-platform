# Deploys the portal. The IVR is a separate repo with its own Render service
# (see farmer-ivr/README.md), so it is not defined here.
# On Render pick New -> Blueprint and point it at this repo.
#
# Free tier disks are wiped on restart, so the database is rebuilt from seed.py
# at every build. Fine for a demo, not for anything real.
services:
  - type: web
    name: krishi-sutra
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      # Where the portal should send outbound call requests.
      - key: IVR_URL
        value: https://farmer-ivr-jky0.onrender.com
      # Set OWM_API_KEY in the dashboard for live weather instead of the mock.

